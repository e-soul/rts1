name: Deploy prototype to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # The official templates archive is ~1.3 GB; keep only the single-threaded web template.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-web-nothreads

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          templates="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p ~/godot "$templates"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$templates"
          rm godot.zip templates.tpz

      - name: Run rules tests
        run: ~/godot/godot --headless --path prototype --script res://tests/run_tests.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path prototype --export-release Web
          test -f build/web/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
